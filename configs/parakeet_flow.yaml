# Parakeet-Flow — the papers' acoustic route, reusing the *trained* light autoencoder.
#
# Why this config exists.  The Tiny variant predicts the token latents in one shot, and round 30
# measured that as a ceiling: a per-dimension correlation of 0.20 with the teacher's latents while the
# autoencoder round trip transcribes at WER 0.0.  SupertonicTTS/Paradee instead *sample* the frame
# latents with a flow-matching velocity field, which is what `ParakeetFlow` implements and what the
# smoke-test recipe trains.  The catch: `parakeet_small.yaml` carries a different autoencoder
# (decoder_dim 384 against the 256 the cached latents were produced with), so training the flow there
# would pair a decoder with latents from an encoder it does not share.
#
# This config is therefore `variant: small` (the flow model) with the **Tiny autoencoder geometry**, so
# the existing corpus caches and the trained autoencoder checkpoint are directly reusable:
#
#   python scripts/train.py --config configs/parakeet_flow.yaml --stage flow \
#       --cache runs/mixed_v2/latent_cache \
#       --warm-start runs/ae_scaled/adversarial/autoencoder_last.pt \
#       --steps 4000 --out runs/flow_v2
#
# Voice conditioning stays `constant` (an embedding per corpus voice) because the corpus is a fixed set
# of teacher voices and reference-based zero-shot conditioning is a separate research step.
name: parakeet-flow
variant: small
voice_mode: constant
n_voices: 1

audio:
  sample_rate: 24000
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  fmax: 12000.0

autoencoder:            # must match the autoencoder that produced the cache, or the flow learns to
  latent_dim: 24        # decode latents that nothing in the corpus produces
  encoder_dims: [64, 96, 128]
  encoder_blocks: [1, 2, 2]
  decoder_dim: 256
  decoder_blocks: 5
  decoder_expansion: 4
  decoder_dilations: [1, 2, 4, 8, 16]
  causal_decoder: true

text:
  vocab_size: 128
  dim: 256
  n_layers: 4
  n_heads: 4
  mode: char

duration:
  hidden: 256
  n_layers: 2
  predict_token_durations: true
  predict_utterance_length: false

speaker:
  n_mels: 80
  emb_dim: 192
  n_query: 8
  style_dim: 256
  freeze: true

flow:
  latent_dim: 24
  compress: 6           # 6 latent frames per flow step, as in SupertonicTTS
  dim: 256              # lighter than the Small config's 384: this variant is meant to be small
  depth: 4
  n_heads: 4
  text_dim: 256
  cond_dim: 256
  nfe: 32
  distilled_nfe: 4
  cfg_scale: 1.5

train:
  batch_size: 8
  lr: 0.0002
  max_steps: 20000
  ema_decay: 0.999
  save_every: 5000
  log_every: 50
  loss:
    mel: 1.0
    spectral: 3.0
    adversarial: 1.0
    feature_match: 2.0
    duration: 1.0
    f0: 1.0
    energy: 1.0
    latent_feature: 1.0
    phase_lock: 0.05
    audio_mel: 1.0
    audio_spectral: 3.0
    audio_aux: 1.0
    signal_latent_contrast: 1.0
